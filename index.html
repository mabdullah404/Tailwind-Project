<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nature-s-platter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="bg-[#f1eee7]">
      <nav class="grid grid-cols-3 gap-4 justify-center container mx-auto pt-4">
        <img src="./assets/nav-logo.png" alt="" class="w-[120px] h-auto" />

        <ul class="flex gap-4 items-center">
          <li><a href="">Product</a></li>
          <li><a href="">Services</a></li>
          <li><a href="">Contact</a></li>
        </ul>

        <div class="flex gap-4 items-center">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-solid fa-cart-shopping"></i>
          <button
            class="rounded border border-green-500 font-semibold py-1 px-4"
          >
            Login
          </button>
          <button
            class="rounded border border-green-500 bg-green-500 font-semibold py-1 px-4"
          >
            Register
          </button>
        </div>
      </nav>

      <section class="text-center">

        <div class="max-w-[40%] mx-auto my-[20px] flex flex-col gap-8">
          <h1 class="text-5xl font-semibold">
            Freshness <span class="text-green-500">You Can <br> Count</span> On, Prices You’ll Love!
          </h1>
          <p>
            Shop your daily essentials at unbeatable prices. From fresh produce
            to pantry <br> staples, we’ve got you covered every day!
          </p>
        </div>

        <img src="./assets/Hero Section 1.png" alt="" class="mx-auto max-w-[800px]" />
      </section>
    </header>
  </body>
</html>
